<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>찬양대 알리미</title>
<meta name="description" content="찬양대 알리미 — 찬양 일정, 파트 연습 영상과 악보">
<!-- 카카오톡 등에 주소를 올렸을 때 보이는 미리보기 -->
<meta property="og:type" content="website">
<meta property="og:url" content="https://yjpraisecal.vercel.app/">
<meta property="og:title" content="찬양대 알리미">
<meta property="og:description" content="인천영종교회 찬양대 — 찬양 일정, 파트 연습 영상과 악보">
<meta property="og:image" content="https://yjpraisecal.vercel.app/icon-512.png">
<link rel="icon" type="image/png" sizes="32x32" href="icon-32.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<!-- 휴대폰 홈 화면에 추가하면 앱처럼 열림 -->
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" sizes="180x180" href="icon-180.png">
<meta name="theme-color" content="#3a9ffd">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="알리미">
<style>
  :root {
    --bg: #f4f6fa; --card: #fff; --line: #e3e8f0; --ink: #16223a; --muted: #6b7689;
    --navy: #24406e; --navy-soft: #e9eef7; --accent: #c9772b; --accent-dark: #a85f20;
    --danger: #b3261e; --ok: #2e7d32;
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font: 15px/1.55 -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", sans-serif;
    -webkit-text-size-adjust: 100%;
  }
  body.big { zoom: 1.2; } /* 큰 글씨 보기 */
  a { color: inherit; }
  button { font: inherit; color: inherit; cursor: pointer; }
  .wrap { max-width: 760px; margin: 0 auto; padding-inline: 16px; }

  /* 머리글 */
  .top { background: #fff; border-bottom: 1px solid var(--line); }
  .top .wrap { display: flex; align-items: center; gap: 12px; padding-block: 14px; }
  /* 음표 상자는 글자 두 줄 높이에 맞춰 늘어남 (정사각형 유지) */
  .brandlink { display: flex; align-items: stretch; gap: 12px; background: none; border: 0; padding: 0; min-width: 0; text-align: left; }
  /* 50px = 제목 줄(26px × 1.2) + 아래 줄(12px × 1.55) 높이 */
  .logo { width: 50px; height: 50px; flex-shrink: 0; align-self: center; border-radius: 10px; background: var(--navy); color: #fff; display: grid; place-items: center; font-size: 24px; text-decoration: none; }
  .brand { min-width: 0; display: flex; flex-direction: column; justify-content: center; }
  .brand b { display: block; font-size: 26px; line-height: 1.2; }
  .brand small { color: var(--muted); font-size: 12px; }
  .topnav { margin-left: auto; flex-shrink: 0; display: flex; gap: 6px; }
  .topnav .btn { display: inline-block; text-decoration: none; font-size: 14px; padding: 8px 12px; }

  main.wrap { padding-block: 24px 40px; }
  .eyebrow { font-size: 12px; letter-spacing: .1em; color: var(--muted); font-weight: 700; margin: 0 0 6px; }
  h1 { font-size: clamp(24px, 6vw, 30px); margin: 0 0 22px; line-height: 1.3; }
  .loadbox { background: #fff; border: 1px solid var(--line); border-radius: 14px; padding: 20px; text-align: center; color: var(--muted); }
  .loadbox p { margin: 0; }
  .loadbox .btn { margin-top: 12px; }
  .kakaobar { display: flex; align-items: flex-start; gap: 10px; margin: 0 0 14px; padding: 12px 14px; background: #fff8d6; border: 1px solid #ecd67a; border-radius: 12px; font-size: 14px; }
  .kakaobar p { margin: 0; flex: 1; }
  .kakaobar a { font-weight: 700; color: var(--navy); }
  .staleMsg { margin: 0 0 14px; font-size: 13px; color: var(--muted); }

  /* 공지사항 */
  .notices { margin: 0 0 18px; display: grid; gap: 8px; }
  .noticebar { display: flex; align-items: center; gap: 10px; width: 100%; text-align: left; background: #fff; border: 1px solid var(--line); border-radius: 14px; padding: 14px 16px; font-weight: 700; font-size: 16px; }
  .noticebar:hover { border-color: var(--navy); }
  .noticebar .tag { background: var(--accent); color: #fff; font-size: 12px; font-weight: 700; border-radius: 999px; padding: 3px 10px; flex-shrink: 0; }
  .noticebar .txt { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .noticebar .more { margin-left: auto; color: var(--muted); font-size: 13px; font-weight: 400; flex-shrink: 0; }
  .noticebar.none { color: var(--muted); font-weight: 400; cursor: default; }

  /* 이번 주 강조 카드 */
  .hero { background: var(--navy); border-radius: 18px; padding: 16px; margin-bottom: 26px; }
  .hero .eyebrow { color: #cdd8ec; margin: 0; font-size: 16px; }
  .herohead { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 10px; }
  .sharebtn { flex-shrink: 0; background: rgb(255 255 255 / .15); color: #fff; border: 1px solid rgb(255 255 255 / .4); border-radius: 999px; padding: 5px 14px; font-size: 14px; font-weight: 600; }
  .sharebtn:hover { background: rgb(255 255 255 / .25); }

  /* 내 파트 (이 기기에 저장) */
  .mypart { display: flex; align-items: center; flex-wrap: wrap; gap: 6px; margin: -6px 0 16px; }
  .mypart .mplabel { font-size: 14px; font-weight: 700; color: var(--muted); margin-right: 2px; }
  .mypart .btn { padding: 6px 12px; font-size: 14px; }
  .mypart .btn[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: #fff; }
  .mypart .mphint { font-size: 12px; color: var(--muted); }
  .hero .card { border: 0; }
  .hero .card + .card { margin-top: 10px; }

  /* 검색·달 선택 */
  /* 검색창 — 알약 모양, 왼쪽 돋보기, 글자를 치면 오른쪽 안에 지우기(×) */
  .searchrow { position: relative; display: flex; align-items: center; margin-bottom: 16px; }
  .searchrow .glass { position: absolute; left: 16px; display: grid; place-items: center; color: var(--muted); pointer-events: none; }
  .searchrow input {
    flex: 1; min-width: 0; font: inherit; font-size: 15px;
    padding: 12px 44px 12px 44px; border: 1px solid #d7dde6; border-radius: 999px; background: #eef1f5; color: var(--ink);
  }
  .searchrow input::placeholder { color: #65748b; opacity: 1; }
  .searchrow input::-webkit-search-cancel-button { display: none; } /* 기기 기본 × 대신 아래 버튼 사용 */
  .searchrow input:focus { outline: 2px solid var(--navy); outline-offset: 2px; background: #fff; }
  .searchrow .clearbtn {
    position: absolute; right: 8px; width: 30px; height: 30px; border: 0; border-radius: 999px;
    background: #d7dde6; color: #3d4757; font-size: 15px; line-height: 1; display: grid; place-items: center;
  }
  .searchrow .clearbtn:hover { background: #c6cedb; color: var(--ink); }
  .viewhead { margin-bottom: 10px; }
  .viewhead h2 { margin: 0; font-size: 20px; }
  .summary { color: var(--muted); font-size: 13px; }

  /* 조회 모드 선택 */
  .modebar { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 10px; }
  .modebar .btn[aria-pressed="true"] { background: var(--navy); border-color: var(--navy); color: #fff; }

  /* 기간 이동 */
  .periodbar { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-bottom: 14px; }
  .periodbar .arrow { width: 40px; height: 40px; font-size: 20px; line-height: 1; border: 1px solid var(--line); border-radius: 10px; background: #fff; flex-shrink: 0; }
  .periodbar .arrow:hover { background: var(--navy-soft); }
  .periodmid { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; min-width: 0; }
  .ympick { display: flex; gap: 6px; min-width: 0; }
  .ympick select { font: inherit; font-size: 16px; font-weight: 700; color: var(--ink); padding: 8px; border: 1px solid var(--line); border-radius: 10px; background: #fff; min-width: 0; }

  /* 월이 바뀌는 지점 구분선 */
  .monthsep { margin: 0; display: flex; align-items: center; gap: 10px; color: var(--muted); font-size: 14px; font-weight: 700; }
  .monthsep::before, .monthsep::after { content: ""; flex: 1; height: 1px; background: var(--line); }

  /* 일정 카드 */
  .card { display: grid; grid-template-columns: 92px minmax(0, 1fr); background: var(--card); border: 1px solid var(--line); border-radius: 14px; overflow: hidden; }
  .list > * + * { margin-top: 12px; }   /* 카드 사이 간격 (구분선이 끼어도 동일) */
  .list > .monthsep { margin-top: 18px; }
  .card.next { border: 2px solid var(--accent); }
  .card.past { opacity: .55; }
  .date { background: var(--navy-soft); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; padding: 12px 4px; text-align: center; }
  .date .dow { font-size: 14px; color: var(--muted); }
  .date strong { font-size: 25px; color: var(--navy); line-height: 1.15; white-space: nowrap; }
  .date .kind { font-size: 14.3px; background: #fff; border-radius: 6px; padding: 1px 6px; color: var(--navy); word-break: keep-all; line-height: 1.3; }
  .date .people { margin-top: 4px; display: grid; gap: 1px; font-size: 12.1px; font-weight: 700; color: var(--muted); word-break: keep-all; line-height: 1.35; }
  .body { padding: 14px 16px; min-width: 0; }
  .titlerow { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 8px; }
  .titlerow h3 { margin: 0; font-size: 22px; overflow-wrap: anywhere; }
  .headchips .chip { max-width: 100%; overflow-wrap: anywhere; }
  .headchips { display: flex; flex-wrap: wrap; gap: 6px; margin-left: auto; max-width: 100%; }
  .badge { background: var(--accent); color: #fff; font-size: 12px; font-weight: 700; border-radius: 999px; padding: 1px 9px; }
  .done { color: var(--muted); font-size: 12px; }
  .group { margin-top: 10px; }
  .label { margin: 0 0 6px; font-size: 16px; color: var(--muted); }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .chip { display: inline-flex; align-items: center; gap: 5px; padding: 6px 11px; border-radius: 9px; background: var(--navy-soft); color: var(--navy); text-decoration: none; font-size: 14px; font-weight: 600; }
  .chip:hover { background: #dbe4f3; }
  .group .chips .chip { font-size: 18px; padding: 7px 14px; }  /* 파트 연습 버튼 */
  .chip.hl { background: var(--accent); color: #fff; }         /* 듣기·반주·악보·참고연주 */
  .chip.hl:hover { background: var(--accent-dark); }
  .detailbtn { margin-top: 12px; background: #fff; border: 1px solid var(--line); border-radius: 9px; padding: 6px 12px; font-size: 14px; font-weight: 600; color: var(--navy); }
  .detailbtn:hover { background: var(--navy-soft); }
  /* 안내 메모 — 눈에 띄도록 버건디 계열 */
  .note { margin: 10px 0 0; white-space: pre-line; font-size: 14px; color: #8c1d2e; font-weight: 600; border-left: 3px solid #8c1d2e; padding-left: 10px; }
  .muted { margin: 8px 0 0; color: var(--muted); font-size: 14px; }
  .empty { background: #fff; border: 1px dashed var(--line); border-radius: 14px; padding: 18px; text-align: center; color: var(--muted); margin: 0; }
  .emptySundays { margin: 12px 0 0; color: var(--muted); font-size: 14px; padding: 10px 14px; background: #fff; border: 1px dashed var(--line); border-radius: 10px; }

  /* 화면 아래 고정 유튜브 재생창 */
  .player { position: fixed; left: 0; right: 0; bottom: 0; z-index: 10; background: #0f1a2e; color: #fff; padding: 8px 12px calc(10px + env(safe-area-inset-bottom)); box-shadow: 0 -4px 16px rgb(0 0 0 / .25); }
  .playerhead { max-width: 760px; margin: 0 auto 8px; display: flex; align-items: center; gap: 10px; }
  .playerhead b { flex: 1; min-width: 0; font-size: 15px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .playerhead a { color: #cdd8ec; font-size: 13px; flex-shrink: 0; }
  .playerhead .iconbtn { background: rgb(255 255 255 / .12); border-color: rgb(255 255 255 / .3); color: #fff; }
  .playerframe { width: min(100%, 736px, calc(40vh * 16 / 9)); aspect-ratio: 16 / 9; margin: 0 auto; }
  .playerframe iframe { width: 100%; height: 100%; border: 0; border-radius: 8px; display: block; }

  footer.wrap { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; padding-block: 18px 32px; color: var(--muted); font-size: 13px; border-top: 1px solid var(--line); }

  /* 관리자 화면 */
  .guide { background: #fff; border: 1px solid var(--line); border-radius: 14px; padding: 14px 16px; margin-bottom: 14px; font-size: 14px; }
  .login { max-width: 420px; }
  .hint { font-weight: 400; color: var(--muted); font-size: 12px; }
  .login .hint, .edhint { margin: 0 0 12px; font-size: 14px; }
  .status { font-size: 14px; margin: 0 0 12px; min-height: 1.5em; font-weight: 700; }
  .status.ok { color: var(--ok); }
  .status.err { color: var(--danger); }
  .toolbar { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 10px; }
  .btn { border: 1px solid var(--line); background: #fff; border-radius: 10px; padding: 9px 14px; font-weight: 600; }
  .btn:disabled { opacity: .6; cursor: default; }
  .btn.primary { background: var(--navy); border-color: var(--navy); color: #fff; }
  .btn.danger { color: var(--danger); }
  .edrow { display: flex; align-items: center; justify-content: space-between; gap: 10px; background: #fff; border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; }
  .edrow + .edrow { margin-top: 8px; }
  .edrow.past { opacity: .6; }
  .edinfo { min-width: 0; }
  .edinfo b { display: block; font-size: 13px; color: var(--muted); font-weight: 600; }
  .edinfo span { overflow-wrap: anywhere; }
  /* 편집 목록: 항목별 입력 여부 (칠해짐 = 입력됨, 점선 = 비어 있음) */
  .edtags { display: flex; flex-wrap: wrap; align-items: center; gap: 4px; margin-top: 6px; }
  .edtags .edtag { font-size: 12px; line-height: 1.5; padding: 0 7px; border-radius: 6px; border: 1px solid transparent; background: var(--navy-soft); color: var(--navy); font-weight: 600; }
  .edtags .edtag.off { background: #fff; color: #a3acba; border: 1px dashed #cfd6e0; font-weight: 400; }
  .edtags .edgroup { font-size: 11px; color: var(--muted); margin-left: 6px; }
  .edtags .edgroup:first-child { margin-left: 0; }
  .edbtns { display: flex; gap: 6px; flex-shrink: 0; }
  .edbtns .btn { padding: 6px 10px; }

  /* 창(대화상자) */
  dialog { border: 0; border-radius: 16px; padding: 0; width: min(560px, calc(100% - 24px)); max-height: calc(100% - 24px); }
  dialog::backdrop { background: rgb(0 0 0 / .45); }
  dialog form, .dlgbody { padding: 18px; }
  dialog h3 { margin: 0 0 12px; }
  .dlghead { display: flex; align-items: flex-start; gap: 10px; }
  .dlghead h3 { flex: 1; }
  .iconbtn { border: 1px solid var(--line); background: #fff; border-radius: 9px; width: 34px; height: 34px; font-size: 16px; line-height: 1; flex-shrink: 0; }
  .iconbtn:hover { background: var(--navy-soft); }
  .noticefull { margin: 0; white-space: pre-wrap; overflow-wrap: anywhere; font-size: 16px; line-height: 1.7; }
  .inlink { color: var(--navy); font-weight: 600; }
  .tworow { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .field { display: block; margin-bottom: 12px; font-size: 14px; font-weight: 600; }
  .field input, .field textarea, .field select { display: block; width: 100%; margin-top: 4px; font: inherit; font-weight: 400; padding: 9px 10px; border: 1px solid var(--line); border-radius: 9px; }
  fieldset { border: 1px solid var(--line); border-radius: 12px; margin: 0 0 12px; padding: 10px 12px 0; }
  legend { font-size: 14px; font-weight: 600; padding: 0 4px; }
  .partrow { display: grid; grid-template-columns: 64px 1fr; align-items: center; gap: 8px; margin-bottom: 10px; font-size: 14px; }
  .partrow input { font: inherit; padding: 8px 10px; border: 1px solid var(--line); border-radius: 9px; min-width: 0; }
  .err { color: var(--danger); font-size: 14px; margin: 0 0 10px; }
  .actions { display: flex; justify-content: flex-end; gap: 8px; }
  #fontBtn { min-width: 76px; font-size: 14px; line-height: 1.2; padding: 8px 10px; white-space: nowrap; }
  /* 일정 편집 — 대원용 화면에서 튀지 않게 회색 톤 */
  #toEdit { font-size: 13px; padding: 6px 12px; text-decoration: none; }
  #toEdit, #toPublic { background: #eef1f5; border-color: #d7dde6; color: #4a5568; }
  #toEdit:hover, #toPublic:hover { background: #e3e8ef; color: var(--ink); }
  #fontBtn[aria-pressed="true"] { background: var(--navy); color: #fff; border-color: var(--navy); }
  .top .wrap { flex-wrap: wrap; }
  .logo { flex-shrink: 0; }
  .topnav .btn { white-space: nowrap; }
  @media (max-width: 480px) {
    .periodmid { flex: 1; }
    .body { padding: 12px 10px; }
    /* 편집 목록: 입력 표시를 넓게 쓰고 버튼은 아래 오른쪽으로 */
    .edrow { flex-wrap: wrap; }
    .edinfo { flex: 1 1 100%; }
    .edbtns { margin-left: auto; }
  }
</style>
</head>
<body>
<header class="top">
  <div class="wrap">
    <button type="button" class="brandlink" id="brandBtn" title="새로고침" aria-label="새로고침">
      <span class="logo" aria-hidden="true">♪</span>
      <span class="brand"><b>찬양대 알리미</b><small>인천영종교회</small></span>
    </button>
    <nav class="topnav">
      <button type="button" class="btn" id="fontBtn" aria-pressed="false" title="글자 크기 확대" aria-label="글자 크기 확대">크게 보기</button>
      <a class="btn" href="#" id="toPublic" hidden>일정 보기</a>
    </nav>
  </div>
</header>

<main class="wrap">
  <div class="kakaobar" id="kakaoBar" hidden>
    <p id="kakaoMsg"></p>
    <button type="button" class="iconbtn" id="kakaoClose" aria-label="안내 닫기">✕</button>
  </div>
  <p class="staleMsg" id="staleMsg" hidden></p>

  <!-- 공개 화면 -->
  <div id="publicView">
    <div class="notices" id="notices"></div>

    <div id="schedule" hidden>
      <div class="searchrow">
        <span class="glass" aria-hidden="true">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
            <circle cx="11" cy="11" r="7"></circle><path d="M20 20l-3.6-3.6"></path>
          </svg>
        </span>
        <input type="search" id="searchInput" placeholder="곡 제목 · 지휘자 · 반주자 검색" aria-label="곡 제목, 지휘자, 반주자 검색" autocomplete="off" enterkeyhint="search">
        <button type="button" class="clearbtn" id="searchClear" aria-label="검색어 지우기" title="검색어 지우기" hidden>✕</button>
      </div>

      <div class="mypart" id="myPart" role="group" aria-label="내 파트"></div>

      <section class="hero" id="hero" hidden>
        <div class="herohead">
          <p class="eyebrow" id="heroLabel"></p>
          <button type="button" class="sharebtn" id="shareBtn">공유</button>
        </div>
        <div id="heroCards"></div>
      </section>

      <div class="viewhead">
        <h2 id="viewTitle"></h2>
      </div>

      <div class="modebar" id="modeBar" role="group" aria-label="조회 모드">
        <button type="button" class="btn" id="modeUpcoming" aria-pressed="true"></button>
        <button type="button" class="btn" id="modeMonth" aria-pressed="false">월별 보기</button>
      </div>

      <div class="periodbar" id="periodBar">
        <button type="button" class="arrow" id="prev" aria-label="이전 기간">‹</button>
        <div class="periodmid">
          <div class="ympick" id="ympick" hidden>
            <select id="yearSel" aria-label="연도"></select>
            <select id="monthSel" aria-label="월"></select>
          </div>
          <span class="summary" id="summary"></span>
        </div>
        <button type="button" class="arrow" id="next" aria-label="다음 기간">›</button>
        <button type="button" class="btn" id="nowBtn" hidden></button>
      </div>

      <p class="summary" id="searchSummary" role="status" hidden></p>
      <div class="list" id="list"></div>
      <p class="emptySundays" id="emptySundays" hidden></p>
    </div>
  </div>

<script>
/* ===== 설정 ===== */
// ▼ Apps Script 웹 앱 주소 (설정안내.txt 5단계에서 복사한 주소를 따옴표 안에 붙여 넣기)
const API_URL = 'https://script.google.com/macros/s/AKfycbzt6FAXMBSwMNe-jXw1wnsjOd5_Hhg7c6ezvgLT-gJnoIP3H6zRqbMPcWQ6ByzFYtKOvw/exec';

const PARTS = ['전체', '소프라노', '알토', '테너', '베이스', '반주'];
// 제목 오른쪽 버튼 (데이터 키인 part 값은 그대로 두고 표시 이름만 정함)
const HEAD_PARTS = [{ part: '전체', label: '듣기' }, { part: '반주', label: '반주' }];
const PART_SHORT = { '소프라노': 'S', '알토': 'A', '테너': 'T', '베이스': 'B' };        // 파트 버튼 표시
const MY_PARTS = [...Object.keys(PART_SHORT), '반주'];  // '내 파트'로 고를 수 있는 것
const DOW = ['일', '월', '화', '수', '목', '금', '토'];
const TYPES = ['주일 찬양', '대집회 특송', '모두회 특송', '구역모임 특송']; // 새 구분은 여기에만 추가
const typeLabel = type => ({ '주일 찬양': '주일', '대집회 특송': '집회', '모두회 특송': '모두회', '구역모임 특송': '구역' })[type] || type;
const TYPE_CUSTOM = '__custom__'; // 목록에 없는 구분을 직접 적을 때
const NOTICE_HEAD = 30;   // 첫 화면에 보이는 공지 글자 수
const UPCOMING_WEEKS = 8; // 첫 화면에 보여 줄 기간
const URL_LINE = /^(.*?)\s*(https?:\/\/\S+)$/;
const TOKEN_KEY = 'choir-token', CACHE_KEY = 'choir-cache', BIG_KEY = 'choir-big', PART_KEY = 'choir-part';

/* ===== 공통 도구 ===== */
const $ = id => document.getElementById(id);
const pad = n => String(n).padStart(2, '0');
const sorted = arr => [...arr].sort((a, b) => a.date.localeCompare(b.date));

const todayKey = (d = new Date()) => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`; // 기기 시간 기준
let TODAY = todayKey(); // 앱을 켜 둔 채 날짜가 바뀌면 load()에서 다시 계산

const utc = key => Date.UTC(+key.slice(0, 4), +key.slice(5, 7) - 1, +key.slice(8, 10));
const dayKey = ms => new Date(ms).toISOString().slice(0, 10);
const dowOf = key => new Date(utc(key)).getUTCDay();
const fmtDate = key => `${+key.slice(5, 7)}월 ${+key.slice(8, 10)}일 (${DOW[dowOf(key)]})`;
const periodDate = (key, year = '') => `${key.slice(0, 4) === year ? '' : +key.slice(0, 4) + '. '}${+key.slice(5, 7)}. ${+key.slice(8, 10)}.`;
const typeOf = ev => ev.type || (dowOf(ev.date) === 0 ? '주일 찬양' : '평일 일정'); // 구분이 없는 예전 일정

function sundays(y, m) {
  const out = [];
  for (let d = 1; d <= 31; d++) {
    const t = new Date(Date.UTC(y, m - 1, d));
    if (t.getUTCMonth() !== m - 1) break;
    if (t.getUTCDay() === 0) out.push(t.toISOString().slice(0, 10));
  }
  return out;
}

// http(s) 링크만 허용
function safeUrl(s) {
  try { const u = new URL(String(s || '').trim()); return /^https?:$/.test(u.protocol) ? u.href : ''; }
  catch { return ''; }
}

// 유튜브 등에서 따라붙는 추적 꼬리표를 떼어냄 (저장할 때만 사용)
const TRACKING = ['si', 'pp', 'feature', 'utm_source', 'utm_medium', 'utm_campaign', 'utm_term', 'utm_content'];
function tidyUrl(s) {
  const clean = safeUrl(s);
  if (!clean) return '';
  try {
    const u = new URL(clean);
    TRACKING.forEach(k => u.searchParams.delete(k));
    return u.toString();
  } catch { return clean; }
}

function el(tag, props = {}, ...kids) {
  const n = document.createElement(tag);
  for (const [k, v] of Object.entries(props)) {
    if (v == null || v === false) continue;
    if (k === 'class') n.className = v;
    else if (k.startsWith('on')) n.addEventListener(k.slice(2), v);
    else n.setAttribute(k, v);
  }
  n.append(...kids.flat().filter(x => x != null && x !== false));
  return n;
}

function busy(btn, on, label) {
  btn.disabled = on;
  if (on) { btn.dataset.label = btn.textContent; btn.textContent = label; }
  else if (btn.dataset.label) btn.textContent = btn.dataset.label;
}

/* ===== 화면 상태 ===== */
let events = [], notices = [];
let loadState = 'loading', loadMsg = '', staleMsg = '', refreshing = false, lastLoadAt = 0;
let viewY = +TODAY.slice(0, 4), viewM = +TODAY.slice(5, 7);
let mode = 'upcoming';  // 'upcoming'(다가오는 8주) 또는 'month'(고른 달)
let upcomingStart = dayKey(utc(TODAY) + ((7 - dowOf(TODAY)) % 7) * 864e5);
let query = '';         // 검색어
let showPast = false;   // 편집 화면에서 지난 일정 펼침
let saving = false;     // 저장·삭제를 서버에 보내는 중
const expanded = new Set(); // 목록에서 '자세히 보기'로 펼쳐 둔 일정
let myPart = '';            // 내 파트 (이 기기에만 저장)
try { myPart = MY_PARTS.includes(localStorage.getItem(PART_KEY)) ? localStorage.getItem(PART_KEY) : ''; } catch {}
let token = null;
try { token = sessionStorage.getItem(TOKEN_KEY); } catch {}

function setToken(t) {
  token = t;
  try { t ? sessionStorage.setItem(TOKEN_KEY, t) : sessionStorage.removeItem(TOKEN_KEY); } catch {}
}

/* ===== 서버(Apps Script) ===== */
async function api(body) {
  if (!API_URL) throw new Error('사이트 설정이 끝나지 않았습니다. index.html의 API_URL에 Apps Script 웹 앱 주소를 넣어 주세요.');
  // Apps Script가 가끔 응답을 못 주므로 최대 3번까지 다시 보냄.
  // 저장·삭제는 일정마다 고유 번호(id)로 처리해서, 같은 요청이 두 번 가도 중복되거나 어긋나지 않음
  for (let i = 0; i < 3; i++) {
    const ac = new AbortController();
    // 로그인은 금방 끝나는 요청이라 15초 안에 답이 없으면 끊고 다시 보냄 (저장·삭제는 45초까지 기다림)
    const timer = setTimeout(() => ac.abort(), !body ? 10000 : body.action === 'login' ? 15000 : 45000);
    try {
      const res = body
        // text/plain으로 보내야 Apps Script가 받는 교차 출처 요청(사전 요청 없음)이 됨
        ? await fetch(API_URL, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(body), signal: ac.signal })
        : await fetch(`${API_URL}${API_URL.includes('?') ? '&' : '?'}t=${Date.now()}`, { signal: ac.signal });
      const data = await res.json();
      if (!data.ok) {
        const auth = data.error === 'auth';
        throw Object.assign(new Error(auth ? '로그인이 만료되었습니다. 다시 로그인해 주세요.' : data.error || '요청에 실패했습니다.'), { auth, server: true });
      }
      return data;
    } catch (e) {
      if (e.server) throw e; // 서버가 거절한 요청은 재시도하지 않음
    } finally {
      clearTimeout(timer);
    }
  }
  throw Object.assign(new Error(
    !body ? '일정을 불러오지 못했습니다. 인터넷 연결을 확인하고 잠시 후 다시 시도해 주세요.'
      : body.action === 'login' ? '서버 응답을 받지 못했습니다. 잠시 후 다시 로그인해 주세요.'
      : '세 번 시도했지만 응답이 없습니다. 목록을 다시 불러왔으니 반영됐는지 확인해 주세요. 그대로 다시 저장하셔도 중복되지 않습니다.'
  ), { unknown: true });
}

function applyData(d) {
  events = sorted(d.events || []);
  notices = Array.isArray(d.notices) ? d.notices : [];
}

function saveCache() {
  try { localStorage.setItem(CACHE_KEY, JSON.stringify({ events, notices })); } catch {}
}

function readCache() {
  try {
    const c = JSON.parse(localStorage.getItem(CACHE_KEY));
    if (c && Array.isArray(c.events)) return c;
  } catch {}
  return null;
}

// 지난번에 받은 내용을 먼저 보여 주고, 뒤에서 최신 내용을 받아 바꿈
async function load() {
  // 날짜가 바뀌었으면 '오늘'을 새로 잡고, 보던 8주도 현재 기준이었다면 함께 옮김
  if (todayKey() !== TODAY) {
    const wasNow = upcomingStart === nextSunday();
    TODAY = todayKey();
    if (wasNow) upcomingStart = nextSunday();
  }
  if (loadState !== 'ok') {
    const c = readCache();
    if (c) { applyData(c); loadState = 'ok'; }
  }
  refreshing = true;
  staleMsg = '';
  route();
  try {
    applyData(await api());
    loadState = 'ok';
    lastLoadAt = Date.now();
    saveCache();
  } catch (e) {
    if (loadState === 'ok') staleMsg = '최신 내용을 확인하지 못했습니다. 저장해 둔 내용을 보여 드립니다.';
    else { loadState = 'error'; loadMsg = e.message; }
  } finally {
    refreshing = false;
    route();
  }
}

// 화면을 다시 보거나 창으로 돌아왔을 때 1분이 지났으면 최신 내용을 다시 확인
function refreshIfStale() {
  if (document.visibilityState === 'visible' && !refreshing && !saving && Date.now() - lastLoadAt > 60000) load();
}

/* ===== 공개 화면 ===== */
// 줄마다 "이름 주소" 또는 "주소" 형태인 목록을 버튼 정보로 바꿈 (악보·참고연주 공용)
function linkList(arr, base) {
  const lines = (arr || []).map(s => s.trim()).filter(Boolean);
  return lines.map((line, i) => {
    const m = line.match(URL_LINE), url = m && safeUrl(m[2]);
    return url ? { label: m[1] || (lines.length > 1 ? `${base} ${i + 1}` : base), url, hl: true } : null;
  }).filter(Boolean);
}

/* ===== 유튜브 재생창 ===== */
// 유튜브 주소에서 영상 번호(11자)와 시작 시각(t=90, t=1m30s)을 꺼냄. 유튜브가 아니면 null
function youtube(url) {
  try {
    const u = new URL(url);
    const host = u.hostname.replace(/^(www|m|music)\./, '');
    const id = host === 'youtu.be' ? u.pathname.slice(1)
      : host === 'youtube.com' ? u.searchParams.get('v') || (u.pathname.match(/^\/(?:shorts|embed|live)\/([^/?]+)/) || [])[1]
      : '';
    if (!/^[\w-]{11}$/.test(id || '')) return null;
    const t = /^(?:(\d+)h)?(?:(\d+)m)?(?:(\d+)s?)?$/.exec(u.searchParams.get('t') || u.searchParams.get('start') || '') || [];
    return { id, start: (+t[1] || 0) * 3600 + (+t[2] || 0) * 60 + (+t[3] || 0) };
  } catch { return null; }
}

function play(yt, url, caption) {
  const src = `https://www.youtube-nocookie.com/embed/${yt.id}?playsinline=1&rel=0${yt.start ? '&start=' + yt.start : ''}`;
  $('playerFrame').replaceChildren(el('iframe', {
    src, title: caption, allow: 'encrypted-media; picture-in-picture; fullscreen; clipboard-write; web-share', // 복사·공유 버튼용
    allowfullscreen: '', referrerpolicy: 'strict-origin-when-cross-origin',
  }));
  $('playerTitle').textContent = caption;
  $('playerOpen').href = url; // 재생이 막힌 영상은 유튜브에서 열도록
  $('player').hidden = false;
  document.body.style.paddingBottom = $('player').offsetHeight + 'px'; // 재생창이 목록 끝을 가리지 않게
}

function closePlayer() {
  $('playerFrame').replaceChildren(); // 창을 없애야 소리도 멈춤
  $('player').hidden = true;
  document.body.style.paddingBottom = '';
}

// caption: 재생창 위에 보일 이름 (곡 제목). 유튜브 링크는 새 창 대신 아래 재생창에서 재생
const chip = (x, icon, caption) => {
  const yt = youtube(x.url);
  return el('a', {
    class: 'chip' + (x.hl ? ' hl' : ''), href: x.url, target: '_blank', rel: 'noopener',
    'aria-label': x.full || x.label, title: x.full || x.label,
    onclick: yt && (e => { e.preventDefault(); play(yt, x.url, `${caption} · ${x.full || x.label}`); }),
  }, icon ? el('span', { 'aria-hidden': 'true' }, icon) : null, x.label);
};

// opts.compact: 목록용 간략 카드 (날짜·구분·제목·듣기만) / opts.toggle: '자세히 보기' 버튼 표시
// 맨 위 강조 카드는 옵션 없이 불러 전체를 보여 줌
function card(ev, badge, opts = {}) {
  const { compact, toggle } = opts;
  const past = ev.date < TODAY;
  // 제목 오른쪽: 듣기·반주·악보·참고연주
  const headChips = compact
    ? [
      ...HEAD_PARTS.filter(h => h.part === '전체')
        .map(h => ({ label: h.label, url: safeUrl(ev.parts?.[h.part]), hl: true })),
      myPart && { label: myPart, url: safeUrl(ev.parts?.[myPart]), hl: true, icon: '▶' }, // 접힌 카드에도 내 파트
    ].filter(x => x && x.url)
    : [
      ...HEAD_PARTS.map(h => ({ label: h.label, url: safeUrl(ev.parts?.[h.part]), hl: true })).filter(x => x.url),
      ...linkList(ev.scores, '악보'),
      ...linkList(ev.refs, '참고'),
    ];
  // 아래: 파트 연습 (S·A·T·B)
  const partChips = compact ? [] : PARTS.filter(p => !HEAD_PARTS.some(h => h.part === p))
    .map(p => ({ label: PART_SHORT[p] || p, full: p, url: safeUrl(ev.parts?.[p]), hl: p === myPart })).filter(x => x.url);

  return el('article', { class: 'card' + (past ? ' past' : '') + (badge ? ' next' : '') },
    el('div', { class: 'date' },
      el('span', { class: 'dow' }, DOW[dowOf(ev.date)]),
      el('strong', {}, `${+ev.date.slice(5, 7)}/${+ev.date.slice(8, 10)}`),
      el('span', { class: 'kind' }, typeLabel(typeOf(ev))),
      !compact && (ev.conductor || ev.pianist) && el('div', { class: 'people' },
        ev.conductor && el('span', {}, '지휘: ' + ev.conductor),
        ev.pianist && el('span', {}, '반주: ' + ev.pianist))),
    el('div', { class: 'body' },
      el('div', { class: 'titlerow' }, el('h3', {}, ev.title),
        badge && el('span', { class: 'badge' }, badge),
        past && el('span', { class: 'done' }, '지난 찬양'),
        headChips.length > 0 && el('div', { class: 'headchips' }, headChips.map(x => chip(x, x.icon, ev.title)))),
      partChips.length > 0 && el('div', { class: 'group' },
        el('p', { class: 'label' }, '파트 연습'),
        el('div', { class: 'chips' }, partChips.map(x => chip(x, '▶', ev.title)))),
      !compact && ev.note && el('p', { class: 'note' }, ev.note),
      !compact && !headChips.length && !partChips.length && !ev.note && el('p', { class: 'muted' }, '연습 자료 준비 중'),
      toggle && el('button', {
        type: 'button', class: 'detailbtn',
        onclick: () => {
          expanded.has(ev.id) ? expanded.delete(ev.id) : expanded.add(ev.id);
          renderPublic();
        },
      }, compact ? '자세히 보기 ▾' : '간단히 보기 ▴')));
}

// 글 속의 주소를 눌러서 열 수 있게 바꿈 (문장부호는 링크 밖에 남김)
function linkify(text) {
  const out = [];
  String(text || '').split(/(https?:\/\/\S+)/g).forEach(part => {
    if (!part) return;
    const m = /^(https?:\/\/\S+?)([.,)\]]*)$/.exec(part);
    const url = m && safeUrl(m[1]);
    if (url) {
      out.push(el('a', { href: url, target: '_blank', rel: 'noopener', class: 'inlink' }, m[1]));
      if (m[2]) out.push(m[2]);
    } else {
      out.push(part);
    }
  });
  return out;
}

function renderNotices() {
  const list = notices.map(n => String(n || '').trim()).filter(Boolean);
  if (!list.length) {
    $('notices').replaceChildren(el('p', { class: 'noticebar none' }, '등록된 공지사항이 없습니다.'));

  const slots = notices.map((n, idx) => ({ text: String(n || '').trim(), idx })).filter(x => x.text);
  $('notices').replaceChildren(...slots.map(({ text: full, idx }, i) => {

}

// 이번 주 찬양을 카카오톡 등으로 보냄 (공유 창이 없는 컴퓨터에서는 복사)
async function shareEvents(list) {
  const text = list.map(e => [
    `${fmtDate(e.date)} ${typeLabel(typeOf(e))} 「${e.title}」`,
    ...PARTS.map(p => {
      const url = safeUrl(e.parts?.[p]);
      return url && `${p === '전체' ? '듣기' : p}: ${url}`;
    }).filter(Boolean),
    ...[...linkList(e.scores, '악보'), ...linkList(e.refs, '참고연주')].map(x => `${x.label}: ${x.url}`),
  ].join('\n\n')).join('\n\n\n'); // 링크마다 빈 줄을 두어 누를 때 옆 링크가 눌리지 않게
  const url = location.origin + '/';
  try {
    if (navigator.share) await navigator.share({ title: '찬양대 알리미', text, url });
    else {
      await navigator.clipboard.writeText(`${text}\n\n${url}`);
      alert('복사했습니다. 카카오톡에 붙여 넣으세요.');
    }
  } catch (e) {
    if (e.name !== 'AbortError') alert('공유하지 못했습니다.'); // 공유 창을 닫은 경우는 조용히 넘어감
  }
}

// 지금 화면에 보여 줄 목록과 제목을 정함 (검색 / 다가오는 8주 / 고른 달)
function buildView(heroEvents = []) {
  if (query) {
    const key = query.toLowerCase();
    const list = events.filter(e => [e.title, e.conductor, e.pianist]
      .some(v => String(v || '').toLowerCase().includes(key)));
    return {
      list,
      title: `"${query}" 검색 결과`,
      summary: `${list.length}건 · 곡 제목·지휘자·반주자에서 전체 기간을 찾았습니다`,
      empty: '찾는 내용이 없습니다.',
      emptySundays: [],
    };
  }
  if (mode === 'upcoming') {
    const start = upcomingStart;
    const end = dayKey(utc(start) + UPCOMING_WEEKS * 7 * 864e5);
    // 맨 위 강조 카드에 이미 보여 준 일정은 목록에서 뺌
    const list = events.filter(e => e.date >= start && e.date < end && !heroEvents.includes(e));
    return {
      list,
      title: '찬양 일정 미리보기',
      summary: `${periodDate(start)} – ${periodDate(dayKey(utc(end) - 864e5), start.slice(0, 4))} · ${list.length}곡 등록`,
      empty: heroEvents.some(e => e.date >= start && e.date < end)
        ? '위 찬양 외에 선택한 기간에 등록된 일정이 없습니다.'
        : '선택한 기간에 등록된 찬양이 없습니다.',
      emptySundays: [],
    };
  }
  const monthEvents = events.filter(e => e.date.startsWith(`${viewY}-${pad(viewM)}-`));
  const list = monthEvents; // 월별 보기에서는 강조 카드와 관계없이 모두 표시
  const suns = sundays(viewY, viewM);
  const taken = new Set(monthEvents.filter(e => typeOf(e) === '주일 찬양').map(e => e.date));
  return {
    list,
    title: `${viewY}년 ${viewM}월 찬양 일정`,
    summary: `${list.length}곡 등록 · 주일 ${suns.length}회`,
    empty: '이 달에 등록된 찬양이 없습니다.',
    emptySundays: suns.filter(k => !taken.has(k)),
  };
}

function renderPublic() {
  renderNotices();
  renderMyPart();

  // 오늘 이후 가장 가까운 일정
  const nextDate = events.find(e => e.date >= TODAY)?.date;
  const gap = nextDate ? (utc(nextDate) - utc(TODAY)) / 864e5 : 0;
  const badge = gap === 0 ? '오늘' : gap < 7 ? '이번 주' : '다음 찬양';

  // 맨 위 강조 카드 (검색 중에는 결과만 보이도록 숨김)
  const showHero = !!nextDate && !query;
  $('hero').hidden = !showHero;
  const heroEvents = showHero ? events.filter(e => e.date === nextDate) : [];
  if (showHero) {
    $('heroLabel').textContent = `${badge === '다음 찬양' ? badge : badge + ' 찬양'} · ${fmtDate(nextDate)}`;
    $('heroCards').replaceChildren(...heroEvents.map(e => card(e)));
    $('shareBtn').onclick = () => shareEvents(heroEvents);
  }

  const view = buildView(heroEvents);
  $('viewTitle').textContent = view.title;
  $('summary').textContent = view.summary;
  $('list').replaceChildren(...(view.list.length
    ? view.list.flatMap((e, i) => {
      const month = e.date.slice(0, 7);
      const separator = i > 0 && month !== view.list[i - 1].date.slice(0, 7)
        ? [el('h3', { class: 'monthsep' }, `${+month.slice(0, 4)}년 ${+month.slice(5)}월`)] : [];
      return [...separator, card(e, e.date === nextDate ? badge : null, { compact: !expanded.has(e.id), toggle: true })];
    })
    : [el('p', { class: 'empty' }, view.empty)]));
  // 일정이 하나도 없으면 "등록된 찬양이 없습니다" 안내만 보여 줌
  $('emptySundays').hidden = !view.emptySundays.length || !view.list.length;
  $('emptySundays').textContent = `미등록 주일 ${view.emptySundays.map(k => +k.slice(8)).join(' · ')}일`;
  $('modeBar').hidden = !!query;
  $('periodBar').hidden = !!query;
  $('searchSummary').hidden = !query;
  $('searchSummary').textContent = query ? view.summary : '';
  $('modeUpcoming').textContent = `다가오는 ${UPCOMING_WEEKS}주 보기`;
  $('modeUpcoming').setAttribute('aria-pressed', String(mode === 'upcoming'));
  $('modeMonth').setAttribute('aria-pressed', String(mode === 'month'));
  $('ympick').hidden = mode !== 'month';
  // '현재 8주' 버튼은 기간을 옮겼을 때만 보여 줌
  $('nowBtn').hidden = mode !== 'upcoming' || upcomingStart === nextSunday();
  $('nowBtn').textContent = `현재 ${UPCOMING_WEEKS}주`;
  $('prev').setAttribute('aria-label', mode === 'upcoming' ? `이전 ${UPCOMING_WEEKS}주` : '이전 달');
  $('next').setAttribute('aria-label', mode === 'upcoming' ? `다음 ${UPCOMING_WEEKS}주` : '다음 달');
  $('searchClear').hidden = !query;

  // 연도 선택지: 일정이 있는 해 ~ 올해 앞뒤 1년
  const years = events.map(e => +e.date.slice(0, 4)).concat(+TODAY.slice(0, 4), viewY);
  const fromY = Math.min(...years) - 1, toY = Math.max(...years) + 1;
  $('yearSel').replaceChildren(...Array.from({ length: toY - fromY + 1 }, (_, i) => el('option', { value: fromY + i }, `${fromY + i}년`)));
  $('yearSel').value = viewY;
  $('monthSel').value = viewM;
}

/* ===== 관리자 로그인 ===== */
function loginError(msg) { $('loginErr').textContent = msg; $('loginErr').hidden = false; }

$('loginForm').addEventListener('submit', async e => {
  e.preventDefault();
  const f = e.target, user = f.user.value.trim(), password = f.pw.value;
  if (!user || !password) return loginError('아이디와 비밀번호를 입력해 주세요.');
  busy($('loginSubmit'), true, '확인 중…');
  try {
    setToken((await api({ action: 'login', user, password })).token);
    f.reset();
    $('loginErr').hidden = true;
    route();
  } catch (err) {
    f.pw.value = '';
    loginError(err.message);
  } finally {
    busy($('loginSubmit'), false);
  }
});

/* ===== 편집 화면 ===== */
function flash(msg, isErr) {
  const s = $('edStatus');
  s.textContent = msg;
  s.className = 'status ' + (isErr ? 'err' : 'ok');
  clearTimeout(flash.t);
  if (!isErr) flash.t = setTimeout(() => { s.textContent = ''; }, 4000);
}

// 로그인 만료면 로그인 화면으로, 그 밖의 오류는 편집 화면에 안내
function handleErr(err) {
  if (err.unknown) load(); // 저장·삭제 결과를 모르면 최신 목록으로 확인
  if (err.auth) {
    setToken(null);
    route();
    loginError(err.message);
  } else {
    flash(err.message, true);
  }
}

function applyResult(res, msg) {
  applyData(res);
  saveCache();
  route();
  flash(msg);
}

// 구글 응답이 느려도 기다리지 않도록, 화면에 먼저 반영하고 저장은 뒤에서 처리.
// 실패하면 원래대로 되돌리고 알려 줌 (같은 요청을 다시 보내도 중복되지 않음)
async function mutate(body, applyNow, okMsg) {
  const prevEvents = events, prevNotices = notices;
  saving = true; // 저장이 끝날 때까지 자동 새로고침을 멈춤 (방금 넣은 내용이 깜빡이지 않도록)
  applyNow();
  saveCache();
  route();
  flash('화면에는 반영했습니다. 서버에 저장하는 중입니다…');
  try {
    applyResult(await api(body), okMsg);
  } catch (err) {
    events = prevEvents;
    notices = prevNotices;
    saveCache();
    route();
    handleErr(err);
  } finally {
    saving = false;
  }
}

// 수정 창의 항목 순서대로 입력 여부를 작은 표시로 보여 줌 (구분·제목은 필수라 제외)
function edTags(e) {
  const tag = (label, on, full = label) => el('span', {

  }, label);

function removeEvent(e) {
  if (!confirm(`「${e.title}」(${fmtDate(e.date)}) 일정을 삭제할까요?\n삭제하면 사이트에서 바로 사라집니다.`)) return;
  mutate({ action: 'delete', token, id: e.id },
    () => { events = events.filter(x => x.id !== e.id); },
    '삭제되었습니다.');
}

// asCopy: 기존 일정을 그대로 베껴 새 일정으로 (날짜만 다음 주일로)
function openForm(ev, asCopy) {
  editingId = ev && !asCopy ? ev.id : null;
  const v = ev || { date: nextSunday(), type: TYPES[0], title: '', conductor: '', pianist: '', parts: {}, scores: [], refs: [], note: '' };
  $('formTitle').textContent = asCopy ? '찬양 일정 복제' : ev ? '찬양 일정 수정' : '찬양 일정 추가';

  // 지휘·반주는 이미 쓴 이름을 골라 넣을 수 있게 함
  for (const [id, key] of [['conductorList', 'conductor'], ['pianistList', 'pianist']]) {
    const names = [...new Set(events.map(e => String(e[key] || '').trim()).filter(Boolean))];
    $(id).replaceChildren(...names.map(n => el('option', { value: n })));
  }

  form.date.value = asCopy ? nextSunday() : v.date;
  // 목록에 없는 구분(직접 입력해 둔 값)이면 '직접 입력'으로 열어 줌
  const t = String(v.type || '');
  form.type.value = !t ? '' : TYPES.includes(t) ? t : TYPE_CUSTOM;
  form.typeCustom.value = t && !TYPES.includes(t) ? t : '';
  $('typeCustomRow').hidden = form.type.value !== TYPE_CUSTOM;
  form.title.value = v.title;
  form.conductor.value = v.conductor || '';
  form.pianist.value = v.pianist || '';
  PARTS.forEach(p => { form['part-' + p].value = v.parts?.[p] || ''; });
  form.scores.value = (v.scores || []).join('\n');
  form.refs.value = (v.refs || []).join('\n');
  form.note.value = v.note || '';
  $('formErr').hidden = true;
  $('dlg').showModal();
}

form.addEventListener('submit', async e => {
  e.preventDefault();
  const fd = new FormData(form);
  const picked = fd.get('type');
  const bad = [];
  const ev = {
    date: fd.get('date'),
    type: picked === TYPE_CUSTOM ? fd.get('typeCustom').trim() : picked,
    title: fd.get('title').trim(),
    conductor: fd.get('conductor').trim(),
    pianist: fd.get('pianist').trim(),
    parts: {},
    scores: [],
    refs: [],
    note: fd.get('note').trim(),
  };
  if (!/^\d{4}-\d{2}-\d{2}$/.test(ev.date)) bad.push('날짜');
  if (picked === TYPE_CUSTOM ? !ev.type : !TYPES.includes(ev.type)) bad.push('구분');
  if (!ev.title) bad.push('찬양 제목');
  for (const p of PARTS) {
    const raw = fd.get('part-' + p).trim();
    if (!raw) continue;
    const url = tidyUrl(raw);
    if (url) ev.parts[p] = url; else bad.push(`${p} 링크`);
  }
  // "이름 주소" 줄에서 주소만 정리해 다시 합침
  const cleanLines = (name, label) => fd.get(name).split('\n').map(s => s.trim()).filter(Boolean)
    .map((line, i) => {
      const m = line.match(URL_LINE), url = m && tidyUrl(m[2]);
      if (!url) { bad.push(`${label} ${i + 1}번째 줄`); return line; }
      return (m[1] ? m[1] + ' ' : '') + url;
    });
  ev.scores = cleanLines('scores', '악보');
  ev.refs = cleanLines('refs', '참고연주');

  if (bad.length) {
    const linkBad = bad.some(b => b.includes('링크') || b.startsWith('악보') || b.startsWith('참고연주'));
    $('formErr').textContent = `확인해 주세요: ${bad.join(', ')}${linkBad ? ' (링크는 https:// 로 시작해야 해요)' : ''}`;
    $('formErr').hidden = false;
    return;
  }

  // 같은 날, 같은 구분으로 이미 등록된 일정이 있으면 한 번 물어봄
  const dup = events.find(e => e.id !== editingId && e.date === ev.date && typeOf(e) === ev.type);
  if (dup && !confirm(`${fmtDate(ev.date)}에 이미 "${dup.title}"(${typeLabel(ev.type)}) 일정이 있습니다.\n그래도 저장할까요?`)) return;

  // 새 일정도 사이트에서 고유 번호를 만들어 보냄 → 응답을 못 받아 다시 보내도 중복되지 않음
  if (!editingId) editingId = newId();
  const saved = { ...ev, id: editingId };
  $('dlg').close();
  mutate({ action: 'save', token, id: editingId, event: ev },
    () => { events = sorted([...events.filter(e => e.id !== saved.id), saved]); },
    '저장되었습니다.');
});

/* ===== 공지사항 수정 창 ===== */
let openNotice = 0; // 전체 보기 창에서 열어 둔 공지 번호 (수정 창에서 그 칸으로 커서를 보냄)

$('noticeHint').textContent = `첫 화면에는 각 공지의 앞 ${NOTICE_HEAD}자만 보이고, 누르면 전체 내용이 열립니다. 비워 두면 표시되지 않습니다.`;

function openNoticeEdit(focusIndex = 0) {
  const f = $('noticeForm');
  f.n1.value = notices[0] || '';
  f.n2.value = notices[1] || '';
  $('noticeErr').hidden = true;
  $('noticeEditDlg').showModal();
  const box = focusIndex === 1 ? f.n2 : f.n1;
  box.focus();
  box.setSelectionRange(box.value.length, box.value.length);
}
$('noticeForm').addEventListener('submit', e => {
  e.preventDefault();
  const f = e.target;
  const next = [f.n1.value.trim(), f.n2.value.trim()];
  $('noticeEditDlg').close();
  mutate({ action: 'notices', token, notices: next },
    () => { notices = next; },
    '공지사항이 저장되었습니다.');
});

/* ===== 큰 글씨 보기 (이 기기에만 저장) ===== */
function applyBig(on) {
  document.body.classList.toggle('big', on);
  $('fontBtn').textContent = on ? '작게 보기' : '크게 보기'; // 확대 중에는 되돌리기
  $('fontBtn').setAttribute('aria-pressed', on ? 'true' : 'false');
  $('fontBtn').title = on ? '글자 크기 기본으로' : '글자 크기 확대';
  $('fontBtn').setAttribute('aria-label', $('fontBtn').title);
  try { on ? localStorage.setItem(BIG_KEY, '1') : localStorage.removeItem(BIG_KEY); } catch {}
}

/* ===== 버튼 연결 ===== */
$('loginCancel').onclick = () => { location.hash = ''; };
$('logoutBtn').onclick = () => {
  if (token) api({ action: 'logout', token }).catch(() => {});
  setToken(null);
  location.hash = '';
};
$('addBtn').onclick = () => openForm(null);
$('cancelBtn').onclick = () => $('dlg').close();
$('pastBtn').onclick = () => { showPast = !showPast; renderEditor(); };
$('noticeBtn').onclick = () => openNoticeEdit(0);
$('noticeEditBtn').onclick = () => {   // 공지 전체 보기 창의 E 버튼
  $('noticeDlg').close();
  openNoticeEdit(openNotice);
};
$('noticeCancel').onclick = () => $('noticeEditDlg').close();
$('noticeClose').onclick = () => $('noticeDlg').close();
$('retryBtn').onclick = load;
$('playerClose').onclick = closePlayer;
$('brandBtn').onclick = () => location.reload(); // 이름·음표를 누르면 새로고침
$('fontBtn').onclick = () => applyBig(!document.body.classList.contains('big'));

$('searchInput').oninput = e => { query = e.target.value.trim(); renderPublic(); };
// 키보드에서 확인(엔터)을 누르면 키보드를 닫아 목록이 바로 보이게 함
$('searchInput').onkeydown = e => { if (e.key === 'Enter') { e.preventDefault(); e.target.blur(); } };
$('searchClear').onclick = () => { clearSearch(); renderPublic(); };

$('monthSel').append(...Array.from({ length: 12 }, (_, i) => el('option', { value: i + 1 }, `${i + 1}월`)));
function movePeriod(direction) {
  if (mode === 'upcoming') {
    upcomingStart = dayKey(utc(upcomingStart) + direction * UPCOMING_WEEKS * 7 * 864e5);
    renderPublic();
  } else {
    const date = new Date(Date.UTC(viewY, viewM - 1 + direction, 1));
    showMonth(date.getUTCFullYear(), date.getUTCMonth() + 1);
  }
}
$('prev').onclick = () => movePeriod(-1);
$('next').onclick = () => movePeriod(1);
$('yearSel').onchange = e => showMonth(+e.target.value, viewM);
$('monthSel').onchange = e => showMonth(viewY, +e.target.value);
$('modeMonth').onclick = () => showMonth(viewY, viewM);
// 모드를 다시 고르면 오늘 기준으로 돌아옴
$('modeUpcoming').onclick = () => { mode = 'upcoming'; upcomingStart = nextSunday(); renderPublic(); };
$('nowBtn').onclick = () => {
  upcomingStart = nextSunday();
  renderPublic();
};

document.addEventListener('visibilitychange', refreshIfStale);
addEventListener('focus', refreshIfStale);
addEventListener('hashchange', route);

/* ===== 화면 전환 ===== */
function route() {
  const edit = location.hash === '#edit';
  const showLogin = edit && !token;
  const ready = loadState === 'ok';

  $('publicView').hidden = edit;
  $('loginView').hidden = !showLogin;
  $('editorView').hidden = !edit || showLogin;
  $('toEdit').hidden = edit;
  $('toPublic').hidden = !edit;
  $('schedule').hidden = !ready;
  $('edBody').hidden = !ready;

  $('loadBox').hidden = ready || showLogin;
  $('loadMsg').textContent = loadState === 'loading' ? '일정을 불러오는 중입니다…' : loadMsg;
  $('retryBtn').hidden = loadState !== 'error';
  // 공개 화면과 편집 화면 모두에 최신 내용 확인 상태를 알림
  const stale = ready ? (staleMsg || (refreshing ? '최신 내용을 확인하는 중입니다…' : '')) : '';
  $('staleMsg').textContent = stale;
  $('staleMsg').hidden = !stale || showLogin;

  if (!ready || showLogin) return;
  edit ? renderEditor() : renderPublic();
}

/* ===== 카카오톡 안에서 열렸을 때 =====
   카카오톡 속 브라우저에서는 홈 화면 추가가 안 되므로 기기 브라우저로 안내 */
const KAKAO_KEY = 'choir-kakao-hide';
if (/KAKAOTALK/i.test(navigator.userAgent)) {
  const android = /Android/i.test(navigator.userAgent);
  const external = 'kakaotalk://web/openExternal?url=' + encodeURIComponent(location.href);
  if (android) location.href = external; // 안드로이드는 크롬으로 바로 넘김
  let hide = false;
  try { hide = localStorage.getItem(KAKAO_KEY) === '1'; } catch {}
  if (!hide) {
    $('kakaoMsg').replaceChildren(...(android
      ? ['카카오톡 안에서 열렸습니다. ', el('a', { href: external }, '크롬으로 열기'), '를 누르면 홈 화면에 추가할 수 있어요.']
      : ['카카오톡 안에서 열렸습니다. 오른쪽 아래 ', el('b', {}, '⋯'), ' 버튼 → ', el('b', {}, 'Safari로 열기'), '를 누르면 홈 화면에 추가할 수 있어요.']));
    $('kakaoBar').hidden = false;
  }
  $('kakaoClose').onclick = () => {
    $('kakaoBar').hidden = true;
    try { localStorage.setItem(KAKAO_KEY, '1'); } catch {}
  };
}

/* ===== 시작 ===== */
try { applyBig(localStorage.getItem(BIG_KEY) === '1'); } catch { applyBig(false); }
load();

// 홈 화면 설치(안드로이드 크롬)에 필요한 파일 등록 — 실패해도 사이트는 그대로 동작
if ('serviceWorker' in navigator) {
  addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
}
</script>
</body>
</html>
